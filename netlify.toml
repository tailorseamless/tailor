# Netlify settings for the Tailor Seamless web app (the `client` workspace). The API deploys separately (render.yaml).
# Netlify → Add new site → Import from Git → pick this repository: nothing else to configure here.
# The VITE_* values are set in Netlify → Site configuration → Environment variables (see server/docs/deployment.md).

[build]
  # Built from the repository root, like the API: the client is one workspace of the repo.
  command = "npm --workspace client run build"
  publish = "client/dist"

  [build.environment]
    NODE_VERSION = "22"
    # Every VITE_* value is compiled into the page that visitors download, so none of them is a secret
    # (the Firebase web key is public by design). Without this, Netlify's secret scanner finds those
    # values in the build output and fails the deploy.
    SECRETS_SCAN_OMIT_KEYS = "VITE_API_URL,VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_APP_ID,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_VAPID_KEY,VITE_ENV"

# The app handles its own routes (/orders, /book/<shop>, …): any address that is not a real file opens the app.
# Real files (assets, icons, sw.js, the manifest) are served as they are, because this rule is not forced.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Built files have a hash in their name, so they never change: cache them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker must always be re-checked, or an update could take days to reach installed apps.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # connect-src lists where the app may send requests. https://*.onrender.com covers the API on Render's
    # address; once the API has its own domain, replace it with that domain to tighten this.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https://res.cloudinary.com https://lh3.googleusercontent.com; font-src 'self'; connect-src 'self' https://*.onrender.com https://api.tailorflow.app https://*.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; frame-src https://*.firebaseapp.com https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
