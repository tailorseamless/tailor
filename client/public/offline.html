<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline — Tailor Seamless</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: #faf7f8;
        color: #2a2226;
      }
      main {
        max-width: 360px;
        text-align: center;
      }
      img {
        width: 56px;
        height: 56px;
      }
      h1 {
        font-size: 20px;
        margin: 16px 0 8px;
      }
      p {
        color: #6b5f65;
        line-height: 1.5;
        margin: 0 0 20px;
      }
      a {
        display: inline-block;
        padding: 10px 18px;
        border-radius: 8px;
        background: #7a2f55;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #17121a;
          color: #f1eaee;
        }
        p {
          color: #b9aab2;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" />
      <h1>You're offline</h1>
      <p>Tailor Seamless needs the internet to load your customers and orders. Check your connection and try again.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
